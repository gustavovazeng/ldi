<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>LDI jul26 — Debriefing</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e17;--card:#121826;--border:rgba(255,255,255,.07);--border-h:rgba(255,255,255,.12);
  --text:#e8edf6;--text-strong:#f1f5fb;--muted:#8a96ab;--hint:#6b7689;
  --accent:#3b82f6;--accent-bg:rgba(59,130,246,.16);
  --green:#34d399;--amber:#fbbf24;--red:#f87171;
  --surf:rgba(255,255,255,.03);
}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}

/* ─── App Header ─────────────────────────────────────────────────── */
.app-hdr{position:sticky;top:0;z-index:20;background:rgba(12,17,28,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:0 26px;height:54px;
  display:flex;align-items:center;justify-content:space-between;gap:16px}

.funil-wrap{position:relative}
.funil-btn{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surf);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px}
.funil-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}
.funil-name{font-size:12px;font-weight:600;color:var(--text-strong)}
.funil-status{font-size:9px;color:var(--accent);letter-spacing:.04em}

.hdr-tabs{display:flex;align-items:center;gap:4px}
.htab{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--muted);transition:all .15s;white-space:nowrap}
.htab:hover{color:var(--text)}
.htab.htab-active{background:rgba(59,130,246,.16);color:#fff}
.htab-icon{font-size:13px}

.hdr-right{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--hint);font-family:'JetBrains Mono',monospace}

/* ─── Content ────────────────────────────────────────────────────── */
.app-content{max-width:1640px;margin:0 auto;padding:22px 30px 40px}
.page{display:none}.page.active{display:block}

.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.hdr-title{font-size:22px;font-weight:700;font-family:'Sora',sans-serif;color:var(--text-strong);line-height:1.25}
.hdr-sub{margin-top:5px;font-size:11px;color:var(--hint);font-family:'JetBrains Mono',monospace}
.err{background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.25);border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:13px;color:var(--red);line-height:1.5}
.note{background:rgba(59,130,246,.06);border:1px solid rgba(96,165,250,.2);border-radius:10px;padding:13px 16px;margin-bottom:18px;font-size:12px;color:var(--text);line-height:1.6}
.note b{color:var(--text-strong)}
.note-amber{background:rgba(251,191,36,.06);border-color:rgba(251,191,36,.22)}

/* KPIs */
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}
.kc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;transition:border-color .2s}
.status-legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sl{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--hint)}
.sl-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.kc:hover{border-color:var(--border-h)}
.kc-lbl{font-size:9px;color:var(--hint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-weight:700}
.kc-val{font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:-.02em;font-size:22px;line-height:1.1;color:var(--text-strong)}
.kc-val-sm{font-size:18px}
.kc-sub{font-size:10px;color:var(--hint);margin-top:5px;font-family:'JetBrains Mono',monospace}

.section-lbl{font-size:9px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px;margin-top:20px}

/* Charts */
.cc{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px 14px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.ct{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.lg{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.ll{width:14px;height:2px;border-radius:2px}
.ld{width:7px;height:7px;border-radius:50%}

.tip{background:#1a2236;border:1px solid var(--border-h);border-radius:8px;padding:10px 13px;font-size:12px;box-shadow:0 4px 16px rgba(2,6,20,.45);display:none;position:absolute;pointer-events:none;z-index:20;min-width:150px}
.tl{color:var(--hint);margin-bottom:5px;font-weight:500;font-size:10px;font-family:'JetBrains Mono',monospace}
.tr{display:flex;justify-content:space-between;gap:14px;margin-bottom:2px;font-size:11px}
.tv{color:var(--text-strong);font-weight:600;font-family:'JetBrains Mono',monospace}

/* Table */
table{width:100%;border-collapse:collapse}
th{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--hint);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px;color:var(--text)}
tr:hover td{background:rgba(255,255,255,.02)}
.mono{font-family:'JetBrains Mono',monospace}
.tar{text-align:right}

/* Funnel bars */
.fn-row{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.fn-lbl{width:190px;flex-shrink:0;font-size:12px;color:var(--muted);font-weight:600}
.fn-track{flex:1;background:var(--surf);border-radius:7px;height:30px;position:relative;overflow:hidden}
.fn-fill{height:100%;border-radius:7px;display:flex;align-items:center;padding:0 12px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;color:#0a0e17;white-space:nowrap;transition:width .3s}
.fn-val{width:150px;flex-shrink:0;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-strong);font-weight:600}

.foot{margin-top:18px;font-size:10px;color:var(--hint);text-align:center;font-family:'JetBrains Mono',monospace;opacity:.5}
canvas{display:block}

/* Segment/platform selector pills — sempre alinhado à esquerda, abaixo do título */
.sel-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sel-label{font-size:12px;color:var(--muted);font-weight:500}
.sel-hint{font-size:11px;color:var(--hint)}
.seg-pills{display:flex;gap:3px;background:var(--surf);border:1px solid var(--border);border-radius:9px;padding:3px}
.seg-pill{background:transparent;border:none;color:var(--muted);padding:5px 13px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;transition:all .15s;white-space:nowrap}
.seg-pill:hover{color:var(--text)}
.seg-pill.on{background:var(--text-strong);color:#0a0e17}

/* Chart overlay — botão discreto no canto direito do card (soma linha extra ao gráfico) */
.ov-btns{display:flex;align-items:center;gap:6px}
.btn-ov{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:10px;font-weight:600;
  padding:4px 11px;border-radius:999px;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:'DM Sans',sans-serif}
.btn-ov:hover{border-color:var(--border-h);color:var(--text)}
.btn-ov.on{background:rgba(59,130,246,.18);border-color:rgba(96,165,250,.45);color:#cfe0ff}
.ov-empty{font-size:11px;color:var(--hint);padding:14px 4px;text-align:center;font-style:italic}

/* Análise de qualificação — grid de painéis com barras horizontais */
.ql-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.ql-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px 14px}
.ql-panel-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:13px}
.ql-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ql-row:last-child{margin-bottom:0}
.ql-lbl{width:42%;flex-shrink:0;font-size:11px;color:var(--text);line-height:1.3}
.ql-track{flex:1;background:var(--surf);border-radius:5px;height:18px;position:relative;overflow:hidden}
.ql-fill{height:100%;border-radius:5px;background:var(--accent)}
.ql-val{flex-shrink:0;text-align:right;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-strong);font-weight:600;white-space:nowrap;min-width:90px}

@media(max-width:768px){
  .app-hdr{height:auto;flex-wrap:wrap;padding:0;gap:0;align-items:stretch}
  .funil-wrap{padding:9px 14px;flex-shrink:0;border-bottom:1px solid var(--border);width:auto}
  .hdr-right{order:2;padding:8px 14px}
  .hdr-tabs{order:3;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-wrap:nowrap;gap:2px;padding:6px 14px 8px}
  .hdr-tabs::-webkit-scrollbar{display:none}
  .htab{flex-shrink:0;font-size:11px;padding:5px 10px}
  .app-content{padding:14px 10px 30px;max-width:100%}
  .hdr{flex-direction:column;gap:6px;margin-bottom:14px}
  .hdr-title{font-size:18px}
  .g2,.g3,.g4,.g5{grid-template-columns:repeat(2,1fr)!important;gap:8px!important}
  .kc{padding:12px 13px}
  .kc-val{font-size:18px}
  .kc-val-sm{font-size:15px}
  .fn-lbl{width:110px;font-size:11px}
  .fn-val{width:90px;font-size:11px}
  table{font-size:10px!important}
  td,th{padding:7px 8px!important;white-space:nowrap}
  .seg-pill{padding:5px 10px;font-size:11px}
  .ql-grid{grid-template-columns:1fr!important}
}
</style>

</head>

<header class="app-hdr">

    <div class="funil-btn">
      <span class="funil-dot"></span>

  <nav class="hdr-tabs" id="hdr-tabs">

</div>

// ── Format helpers ──
function fBRL(n){ return "R$ "+(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fBRLorDash(n){ return (n===null||n===undefined)?"—":fBRL(n); }
function fBRLShort(n){ const a=Math.abs(n||0);if(a>=1000)return "R$"+(a/1000).toFixed(1).replace(".",",")+"k";return "R$"+Math.round(a); }
function fDiv(a,b,fmt){ return (a===null||a===undefined||!b)?"—":fmt(a/b); }
function fPct(n){ return (n||0).toFixed(2).replace(".",",")+"%"; }
function fNum(n){ return (n||0).toLocaleString("pt-BR"); }
function fDate(iso){ if(!iso)return"";const[,m,d]=iso.split("-");return `${d}/${m}`; }
// Contagem regressiva pra Aula 01 — rótulos "D-N" nos gráficos diários.
const AULA1_ISO=DATA.aula1_iso;
function diasParaAula1(iso){
  if(!iso)return null;
  const ms=new Date(iso+"T00:00:00")-new Date(AULA1_ISO+"T00:00:00");
  return Math.round(ms/86400000);
}
function fDateAula(iso){
  const dd=diasParaAula1(iso);
  if(dd===null)return fDate(iso);
  const tag=dd===0?"Aula 1":(dd<0?`D${dd}`:`D+${dd}`);
  return `${fDate(iso)} ${tag}`;
}
function fDateBR(iso){ if(!iso)return"—";const[y,m,d]=iso.split("-");return `${d}/${m}/${y}`; }
function dayMapToArr(map){
  return Object.entries(map).sort((a,b)=>a[0]<b[0]?-1:1).map(([d,v])=>({date:d,label:fDate(d),value:v}));
}
function entriesSorted(obj){ return Object.entries(obj).sort((a,b)=>b[1]-a[1]); }

// ── Canvas / Chart helpers (mesmo padrão visual do dashboard principal) ──
const DPR=window.devicePixelRatio||1;
const GRID_C="rgba(255,255,255,0.06)";
const TICK_C="#6b7689";

function initCanvas(id,cssW,cssH){
  const c=document.getElementById(id);if(!c)return null;
  cssW=Math.max(cssW,50);cssH=Math.max(cssH,50);
  c.width=Math.round(cssW*DPR);c.height=Math.round(cssH*DPR);
  c.style.width=cssW+"px";c.style.height=cssH+"px";
  const ctx=c.getContext("2d");if(!ctx)return null;ctx.scale(DPR,DPR);
  return ctx;
}
function drawLineArea(ctx,xP,yP,vals,color,fill){
  if(vals.length<2)return;
  if(fill){
    const n=vals.length;
    ctx.beginPath();ctx.moveTo(xP(0),yP(vals[0]));
    for(let i=1;i<n;i++)ctx.lineTo(xP(i),yP(vals[i]));
    ctx.lineTo(xP(n-1),yP(0));ctx.lineTo(xP(0),yP(0));ctx.closePath();
    const g=ctx.createLinearGradient(0,0,0,ctx.canvas.height/DPR);
    g.addColorStop(0,color+"28");g.addColorStop(1,color+"00");
    ctx.fillStyle=g;ctx.fill();
  }
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([]);
  ctx.moveTo(xP(0),yP(vals[0]));
  for(let i=1;i<vals.length;i++)ctx.lineTo(xP(i),yP(vals[i]));
  ctx.stroke();
  vals.forEach((v,i)=>{
    ctx.beginPath();ctx.arc(xP(i),yP(v),2.5,0,Math.PI*2);
    ctx.fillStyle=color;ctx.fill();
  });
}
function drawBars(ctx,xP,yP,yZero,vals,color,barW){
  vals.forEach((v,i)=>{
    const x=xP(i)-barW/2, y=Math.min(yP(v),yZero), h=Math.abs(yP(v)-yZero);
    ctx.fillStyle=color+"cc";
    ctx.fillRect(x,y,barW,Math.max(h,v>0?1:0));
  });
}
function drawBarSingle(id,data,key,color,cssW,cssH,fmt){
  fmt=fmt||(v=>String(Math.round(v)));
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:12,b:28,l:46};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>d[key]||0);
  const maxV=Math.max(...vals,1)*1.15;
  const n=data.length;
  const barW=Math.max(4,Math.min(22,(cW/Math.max(n,1))*0.7));
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(v/maxV)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="right";
    ctx.fillText(fmt(maxV-(i/4)*maxV),P.l-5,y+3);
  }
  drawBars(ctx,xP,yP,P.t+cH,vals,color,barW);
  const step=n>28?3:n>14?2:1;
  ctx.textAlign="center";
  vals.forEach((v,i)=>{
    if(v>0&&(n<=20||i%step===0)){
      ctx.fillStyle="#e8edf6";ctx.font=`bold ${Math.min(10,Math.max(7,barW*0.6))}px 'JetBrains Mono',monospace`;
      ctx.fillText(fmt(v),xP(i),yP(v)-4);
    }
  });
  ctx.fillStyle=TICK_C;ctx.font="9px 'JetBrains Mono',monospace";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}
function setupTip(cid,tid,data,lines,padL=46,padR=12){
  const c=document.getElementById(cid),t=document.getElementById(tid);
  if(!c||!t)return;
  c.addEventListener("mousemove",e=>{
    const rect=c.getBoundingClientRect();
    const relX=(e.clientX-rect.left)-padL;
    const cW=rect.width-padL-padR;
    if(relX<0||relX>cW||!data.length){t.style.display="none";return;}
    const d=data[Math.max(0,Math.min(Math.round((relX/cW)*(data.length-1)),data.length-1))];
    let h=`<div class="tl">${d.label||d.date}</div>`;
    lines.forEach(l=>{
      h+=`<div class="tr"><span style="color:${l.color}">${l.name}</span><span class="tv">${(l.fmt||fNum)(+(d[l.key])||0)}</span></div>`;
    });
    t.innerHTML=h;t.style.display="block";
    const tw=t.offsetWidth,x=e.clientX-rect.left;
    t.style.left=(x+12+tw>rect.width-8?x-tw-12:x+12)+"px";
    t.style.top=(e.clientY-rect.top-20)+"px";
  });
  c.addEventListener("mouseleave",()=>t.style.display="none");
}
// ── Farol de meta (3 níveis) — mesmo modelo usado no dashboard "index.html"
// (Carrinho ao vivo): 🟢 dentro da meta / 🟡 até 10% fora / 🔴 mais de 10% fora.
// higherIsBetter=true -> quanto maior melhor (ex: frequência); false -> quanto
// menor melhor (ex: CPC, custo/ficha).
function statusColor(val,meta,higherIsBetter){
  if(!val||val===0)return "#8a96ab";
  const ratio=val/meta;
  if(higherIsBetter){ if(ratio>=1)return "#34d399";if(ratio>=0.9)return "#fbbf24";return "#f87171"; }
  else { if(ratio<=1)return "#34d399";if(ratio<=1.1)return "#fbbf24";return "#f87171"; }
}
function statusBorder(val,meta,higherIsBetter){
  const c=statusColor(val,meta,higherIsBetter);
  if(c==="#34d399") return "rgba(52,211,153,.35)";
  if(c==="#fbbf24") return "rgba(251,191,36,.35)";
  if(c==="#f87171") return "rgba(248,113,113,.35)";
  return "var(--border)";
}
function metaEmoji(val,meta,higherIsBetter){
  if(meta===null||meta===undefined)return "";
  if(!val)return "🔴";
  const c=statusColor(val,meta,higherIsBetter);
  if(c==="#34d399")return "🟢";
  if(c==="#fbbf24")return "🟡";
  return "🔴";
}
function statusLegend(){
  return `<div class="status-legend">
    <span class="sl"><span class="sl-dot" style="background:#34d399"></span>Dentro da meta</span>
    <span class="sl"><span class="sl-dot" style="background:#fbbf24"></span>Até 10% fora</span>

function kpiCard(lbl,val,sub,color,small,rawVal,meta,higher){

// Barra de funil com escala em raiz quadrada (senão a última etapa fica invisível
// perto das primeiras, que são ordens de grandeza maiores)
function funnelRow(lbl,val,maxVal,color){
  const pct=Math.max(4,Math.sqrt(val/maxVal)*100);
  return `<div class="fn-row">
    <div class="fn-lbl">${lbl}</div>
    <div class="fn-track"><div class="fn-fill" style="width:${pct}%;background:${color}">${fNum(val)}</div></div>

}

// Linha (série única) — mesmo estilo visual das barras, usado nos overlays opcionais
function drawLineSingle(id,data,key,color,cssW,cssH,fmt){
  fmt=fmt||(v=>String(Math.round(v)));
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:12,b:28,l:52};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>d[key]||0);
  const maxV=Math.max(...vals,0.01)*1.2;
  const n=data.length;
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(v/maxV)*cH;
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="right";
    ctx.fillText(fmt(maxV-(i/4)*maxV),P.l-5,y+3);
  }
  drawLineArea(ctx,xP,yP,vals,color,true);
  const step=n>28?3:n>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

// Barras (eixo esquerdo) + 1 linha sobreposta opcional (eixo direito, escala própria) —
// mesmo padrão visual do dual-axis "Investimento × Custo/ficha": duas colunas de rótulos
// nas bordas, cada uma na cor da sua série.
function drawBarLineDual(id,data,barKey,barColor,barFmt,lineKey,lineColor,lineFmt,cssW,cssH){
  barFmt=barFmt||(v=>String(Math.round(v)));
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const hasLine=!!lineKey;
  const P={t:14,r:hasLine?58:14,b:28,l:52};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const barVals=data.map(d=>d[barKey]||0);
  const barMax=Math.max(...barVals,1)*1.15;
  const n=data.length;
  const barW=Math.max(4,Math.min(22,(cW/Math.max(n,1))*0.7));
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yPBar=v=>P.t+cH-(v/barMax)*cH;
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="right";
    ctx.fillText(barFmt(barMax-(i/4)*barMax),P.l-5,y+3);
  }
  drawBars(ctx,xP,yPBar,P.t+cH,barVals,barColor,barW);
  if(hasLine){
    const lineVals=data.map(d=>d[lineKey]||0);
    const lineMax=Math.max(...lineVals,0.01)*1.25;
    const yPLine=v=>P.t+cH-(v/lineMax)*cH;
    for(let i=0;i<=4;i++){
      const y=P.t+(i/4)*cH;
      ctx.fillStyle=lineColor;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="left";
      ctx.fillText(lineFmt(lineMax-(i/4)*lineMax),P.l+cW+5,y+3);
    }
    drawLineArea(ctx,xP,yPLine,lineVals,lineColor,false);
  }
  const step=n>28?3:n>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

// scroll e o cursor, o input perde o foco e a página pula pro topo a cada tecla.
function reRenderPreservando(inputId,setter,v){
  const scrollY=window.scrollY;
  const active=document.activeElement;
  const hadFocus=active&&active.id===inputId;
  const selStart=hadFocus?active.selectionStart:null;
  const selEnd=hadFocus?active.selectionEnd:null;
  setter(v);
  renderTab(S.currentPage);
  window.scrollTo(0,scrollY);
  if(hadFocus){
    const input=document.getElementById(inputId);
    if(input){ input.focus(); if(selStart!==null) input.setSelectionRange(selStart,selEnd); }
  }
}

function sortRows(rows,sortState){
  const {col,dir}=sortState;

    let av=a[col],bv=b[col];
    if(av===null||av===undefined)av=dir==="asc"?Infinity:-Infinity;
    if(bv===null||bv===undefined)bv=dir==="asc"?Infinity:-Infinity;
    if(typeof av==="string")return dir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return dir==="asc"?av-bv:bv-av;
  });
}

const METRIC_COLS=[
  ["leads","Leads únicos"],["vendas","Vendas"],["conv","Conversão em vendas"],
  ["custoLead","Custo por lead"],["pctA","% Faixa A (A+/A)"],["pctB","% Faixa B"],
  ["pctC","% Faixa C"],["pctD","% Faixa D"],["pctE","% Faixa E"],
  ["pctPesquisa","% resposta pesquisa"],["investimento","Investimento"],
  ["faturamento","Faturamento"],["roas","ROAS"],["custoVenda","Custo por venda"],
];
const CAMP_COLS=[["campanha","Campanha",true],...METRIC_COLS.map(([a,b])=>[a,b,false])];
const AD_COLS=[["anuncio","Anúncio",true],...METRIC_COLS.map(([a,b])=>[a,b,false])];
function fmtCol(col,v){
  if(v===null||v===undefined)return "—";
  if(col==="campanha"||col==="anuncio")return v;
  if(col==="leads"||col==="vendas")return fNum(v);
  if(["conv","pctA","pctB","pctC","pctD","pctE","pctPesquisa"].includes(col))return fPct(v);
  if(["custoLead","investimento","faturamento","custoVenda"].includes(col))return fBRL(v);
  if(col==="roas")return v.toFixed(2).replace(".",",")+"x";
  return v;
}
// %/custo/ROAS SEMPRE recalculados a partir dos campos brutos — nunca média de
// percentual (senão a linha de Total distorce).
function calcRow(r){
  const leads=r.leads, vendas=r.vendas, fat=r.faturamento, resp=r.respondeu_pesquisa;
  const investimento=r.investimento??null;
  return {...r, investimento,
    conv: leads?vendas/leads*100:0,
    custoLead: (investimento&&leads)?investimento/leads:null,
    pctA: resp?(r.faixa_a_mais+r.faixa_a)/resp*100:0,
    pctB: resp?r.faixa_b/resp*100:0,
    pctC: resp?r.faixa_c/resp*100:0,
    pctD: resp?r.faixa_d/resp*100:0,
    pctE: resp?r.faixa_e/resp*100:0,
    pctPesquisa: leads?resp/leads*100:0,
    roas: investimento?fat/investimento:null,
    custoVenda: (investimento&&vendas)?investimento/vendas:null};
}
function sumRows(rows){
  const s={leads:0,vendas:0,faturamento:0,faixa_a_mais:0,faixa_a:0,faixa_b:0,faixa_c:0,faixa_d:0,faixa_e:0,respondeu_pesquisa:0,investimento:0};
  for(const r of rows){
    s.leads+=r.leads||0; s.vendas+=r.vendas||0; s.faturamento+=r.faturamento||0;
    s.faixa_a_mais+=r.faixa_a_mais||0; s.faixa_a+=r.faixa_a||0; s.faixa_b+=r.faixa_b||0;
    s.faixa_c+=r.faixa_c||0; s.faixa_d+=r.faixa_d||0; s.faixa_e+=r.faixa_e||0;
    s.respondeu_pesquisa+=r.respondeu_pesquisa||0; s.investimento+=(r.investimento||0);
  }
  return s;
}

// ETAPAS DE VÍDEO — Aquecimento / Lembrete / Aulas
// CPC = investido/cliques · Tx75% = 75% assistido / views 3s ·
// Cptx75% = investido / 75% assistido.
// Sem benchmark de lançamento anterior nem meta informada nesta rodada, então
// nenhum KPI usa farol 🟢/🟡/🔴 — quando os números do LDI anterior chegarem,
// basta preencher BENCHMARKS abaixo que os badges voltam a aparecer.
// Alcance e Frequência não são somáveis linha a linha (sobreposição de
// audiência) e não vieram nas planilhas — ficam de fora até serem informados.
// ═══════════════════════════════════════════════════════════════════════
const BENCHMARKS={aquecimento:null,lembrete:null,aulas:null};
function benchHigher(b){ return b&&b.direcao==="maior_melhor"; }
function benchSub(b,fmt){ return b?`meta ${fmt(b.valor)}`:""; }
function benchColor(val,b){ return b?statusColor(val,b.valor,benchHigher(b)):"var(--text-strong)"; }
function kpiBench(lbl,val,bench,rawVal,fmt){
  return bench
    ? kpiCard(lbl,val,benchSub(bench,fmt),benchColor(rawVal,bench),false,rawVal,bench.valor,benchHigher(bench))
    : kpiCard(lbl,val,"","var(--text-strong)");
}

const VIDEO_COLS=[
  ["anuncio","Anúncio",true],["investido","Investido"],["cliques","Cliques"],["cpc","CPC"],
  ["impressoes","Impressões"],["v75","75% assistido"],["v3s","Views 3s"],
  ["tx75","Tx 75%"],["cptx75","Cptx75%"],
];
function fmtVideoCol(col,v){
  if(v===null||v===undefined)return "—";
  if(col==="anuncio")return v;
  if(["cliques","impressoes","v75","v3s"].includes(col))return fNum(v);
  // Métrica derivada com denominador zero (anúncio sem view/clique) vira 0 no
  // precompute — exibir "R$ 0,00" daria a impressão de custo zero, então mostra
  // travessão. Investido zero é zero de verdade e continua aparecendo.
  if(["cpc","cptx75"].includes(col))return v?fBRL(v):"—";
  if(col==="tx75")return v?fPct(v):"—";
  if(col==="investido")return fBRL(v);
  return v;
}
// Total da tabela: soma os brutos e recalcula CPC/Tx75%/Cptx75% da soma.
function somaVideo(rows){
  const s=rows.reduce((a,r)=>({investido:a.investido+r.investido,cliques:a.cliques+r.cliques,
    impressoes:a.impressoes+r.impressoes,v75:a.v75+r.v75,v3s:a.v3s+r.v3s}),
    {investido:0,cliques:0,impressoes:0,v75:0,v3s:0});
  s.cpc=s.cliques?s.investido/s.cliques:0;
  s.tx75=s.v3s?s.v75/s.v3s*100:0;
  s.cptx75=s.v75?s.investido/s.v75:0;
  return s;
}
function tabelaVideo(rows,sortState,sortFn,searchId,searchVal,searchHandler,titulo,extraFiltro){
  const q=searchVal.trim().toLowerCase();
  const rowsF=q?rows.filter(a=>a.anuncio.toLowerCase().includes(q)):rows;
  const sorted=sortRows(rowsF,sortState);
  const soma=somaVideo(rowsF);
  const trAd=a=>`<tr>
    ${VIDEO_COLS.map(([col,,isName])=>isName
      ?`<td style="text-align:left;white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis" title="${a.anuncio}">${a.anuncio}</td>`
      :`<td class="mono tar">${fmtVideoCol(col,a[col])}</td>`).join("")}
    <td style="text-align:center">${a.instagram_url?`<a href="${a.instagram_url}" target="_blank" rel="noopener noreferrer" style="color:#60a5fa;text-decoration:none;font-size:11px">↗ Ver</a>`:'<span style="color:var(--hint)">—</span>'}</td>
  </tr>`;
  const totalRow=rowsF.length?`<tr style="border-top:2px solid var(--border-h);background:rgba(96,165,250,.07)">
    ${VIDEO_COLS.map(([col,,isName])=>`<td class="${isName?"":"mono"} tar" style="font-weight:700${isName?";text-align:left;white-space:nowrap":""}">${isName?`Total (${rowsF.length})`:fmtVideoCol(col,soma[col])}</td>`).join("")}
    <td></td></tr>`:"";
  return `
    <div class="section-lbl" style="margin-top:20px">${titulo||"Anúncios"}</div>
    ${extraFiltro||""}
    ${searchBox(searchId,searchVal,"Buscar anúncio…",searchHandler)}
    <div class="cc" style="padding:0;overflow:hidden">
      <div style="overflow-x:auto"><table>
        <thead><tr>${VIDEO_COLS.map(([col,lbl,isName])=>thSort(col,lbl,sortState,sortFn,isName?"left":"right")).join("")}<th style="width:60px;text-align:center">Ver</th></tr></thead>
        <tbody>${sorted.length===0?`<tr><td colspan="${VIDEO_COLS.length+1}" style="text-align:center;color:var(--hint);padding:20px">Nenhum anúncio encontrado</td></tr>`:sorted.map(trAd).join("")}${totalRow}</tbody>
      </table></div>
    </div>`;
}

const ORIGEM_MAP={"wp":"Whatsapp","wp-antigos":"Whatsapp","wp-suporte":"Whatsapp","whatsapp":"Whatsapp",
  "youtube":"Youtube","qrcode":"Youtube","api-pvd":"API","api":"API","instagram":"Instagram Orgânico",
  "em,ActiveCampaign":"Email","em":"Email","email":"Email","aliado":"Aliados","LDI":"Lista LDI",
  "(não informado)":"Sem UTM","xxxxx":"Sem UTM"};
function normOrigem(o){ if(o&&o.includes("FBAds"))return "Tráfego"; return ORIGEM_MAP[o]||o; }
function canalKey(origem,canal){
  if(origem&&origem.includes("FBAds"))return origem;   // o canal do tráfego é o posicionamento
  if(origem==="instagram")return `${origem}-${canal||"(não informado)"}`;
  return origem||"(não informado)";
}

function setFxCanalSearch(v){ reRenderPreservando("fx-canal-search-input",x=>S.fxCanalSearch=x,v); }

function getOrigemRows(fichas,vendas){
  const byF={},byV={};
  for(const f of fichas){ const o=normOrigem(f.origem); byF[o]=(byF[o]||0)+1; }
  for(const v of vendas){ const o=normOrigem(v.origem); byV[o]=(byV[o]||0)+1; }
  const totalFichas=Object.values(byF).reduce((a,b)=>a+b,0);
  return [...new Set([...Object.keys(byF),...Object.keys(byV)])].map(o=>{
    const fc=byF[o]||0, vc=byV[o]||0;
    return {origem:o,fichas:fc,vendas:vc,conv:fc?vc/fc*100:0,repres:totalFichas?fc/totalFichas*100:0};
  });
}
function getCanalRows(fichas,vendas,selOrigens){
  const hasSel=selOrigens&&selOrigens.size>0;
  const byF={},byV={};
  for(const f of fichas){
    if(hasSel&&!selOrigens.has(normOrigem(f.origem)))continue;
    const c=canalKey(f.origem,f.canal); byF[c]=(byF[c]||0)+1;
  }
  for(const v of vendas){
    if(hasSel&&!selOrigens.has(normOrigem(v.origem)))continue;
    const c=canalKey(v.origem,v.canal); byV[c]=(byV[c]||0)+1;
  }
  return [...new Set([...Object.keys(byF),...Object.keys(byV)])].map(c=>{
    const fc=byF[c]||0, vc=byV[c]||0;
    return {canal:c,fichas:fc,vendas:vc,conv:fc?vc/fc*100:0};
  });
}
function fichasPorDiaMap(fichas,selO,selC){
  const hasO=selO&&selO.size>0, hasC=selC&&selC.size>0;
  const byDate={};
  for(const f of fichas){
    if(!f.date)continue;
    if(hasO&&!selO.has(normOrigem(f.origem)))continue;
    if(hasC&&!selC.has(canalKey(f.origem,f.canal)))continue;
    byDate[f.date]=(byDate[f.date]||0)+1;
  }
  return byDate;
}

function contaFichas(pred){ return DATA.carrinho.anuncios.ficha_attrib.filter(pred).length; }
function contaVendas(pred){
  let n=0,v=0;
  for(const x of DATA.carrinho.anuncios.venda_attrib){ if(pred(x)){n++;v+=x.valor;} }
  return {n,v};
}
function metricasAnuncio(base,fichasPred,fichasPrecoPred,vendasPred){
  const leads=contaFichas(fichasPrecoPred), leadsTotal=contaFichas(fichasPred);
  const {n:vendas,v:valorVendas}=contaVendas(vendasPred);
  return {...base,leads,leadsTotal,vendas,valorVendas,
    cpc: base.clicks?base.spend/base.clicks:0,
    ctr: base.impressions?base.clicks/base.impressions*100:0,
    cpm: base.impressions?base.spend/base.impressions*1000:0,
    cpl: leads?base.spend/leads:0,
    cplTotal: leadsTotal?base.spend/leadsTotal:0,
    roas: base.spend?valorVendas/base.spend:0,
    custoVenda: vendas?base.spend/vendas:0,
    convFichaVenda: leadsTotal?vendas/leadsTotal*100:0};
}
function getCampRowsCarrinho(){
  const byCamp={};
  for(const r of DATA.carrinho.anuncios.meta_carrinho_rows){
    const cn=r.campName||"(sem campanha)";
    if(!byCamp[cn])byCamp[cn]={campName:cn,spend:0,clicks:0,impressions:0};
    byCamp[cn].spend+=r.spend; byCamp[cn].clicks+=r.clicks; byCamp[cn].impressions+=r.impressions;
  }
  return Object.values(byCamp).map(c=>metricasAnuncio(c,
    f=>f.campName===c.campName,
    f=>f.campName===c.campName&&f.comPreco,
    v=>v.campName===c.campName));
}
function getAdRowsCarrinho(selCamps){
  const hasSel=selCamps&&selCamps.size>0;
  let rows=DATA.carrinho.anuncios.meta_carrinho_rows;
  if(hasSel)rows=rows.filter(r=>selCamps.has(r.campName));
  const byAd={};
  for(const r of rows){
    const an=r.adName||"(sem anúncio)";
    if(!byAd[an])byAd[an]={adName:an,spend:0,clicks:0,impressions:0,igUrl:"",camps:new Set()};
    byAd[an].spend+=r.spend; byAd[an].clicks+=r.clicks; byAd[an].impressions+=r.impressions;
    if(!byAd[an].igUrl&&r.igUrl)byAd[an].igUrl=r.igUrl;
    if(r.campName)byAd[an].camps.add(r.campName);
  }
  const dentro=x=>!hasSel||selCamps.has(x.campName);
  return Object.values(byAd).map(a=>{
    const m=metricasAnuncio(a,
      f=>f.adName===a.adName&&dentro(f),
      f=>f.adName===a.adName&&dentro(f)&&f.comPreco,
      v=>v.adName===a.adName&&dentro(v));
    m.campNames=[...a.camps].join(", ");
    return m;
  });
}
function adResumoCarrinho(a){
  return [`Nome do ad ⤵️`,a.adName,``,a.igUrl||"",
    `Investimento:\t${fBRL(a.spend)}`,`Fichas: ${a.leadsTotal}`,
    `Cust/ ficha:\t${a.leadsTotal>0?fBRL(a.cplTotal):"—"}`,``,
    `CPC:\t${fBRL(a.cpc)}`,`CTR:\t${fPct(a.ctr)}`,`CPM:\t${fBRL(a.cpm)}`,
    `__________________________`].join("\n");
}
function copyFxAdResumo(){
  const el=document.getElementById("carrinho-sub-content");
  const text=el&&el._resumo||"";
  if(!text)return;
  navigator.clipboard.writeText(text).then(()=>{
    document.querySelectorAll(".btn-copy-ads").forEach(b=>{
      const orig=b.textContent; b.textContent="✓ Copiado!";
      setTimeout(()=>{b.textContent=orig;},1500);
    });
  }).catch(()=>{});
}

// Conversão da página = cadastros / sessões.
function sortPg(col){ toggleSort(S.pgSort,col); }
function renderPaginasSection(){
  const pg=DATA.paginas, t=pg.totais;
  const sorted=sortRows(pg.rows,S.pgSort);
  const soma=pg.rows.reduce((a,r)=>({sessoes:a.sessoes+r.sessoes,cadastros:a.cadastros+r.cadastros}),{sessoes:0,cadastros:0});
  return `
    <div class="section-lbl" style="margin-top:24px">Páginas de cadastro — sessões × cadastros</div>
    <div class="cc" style="padding:0;overflow:hidden">
      <div style="overflow-x:auto"><table>
        <thead><tr>${thSort("page","Page path",S.pgSort,"sortPg","left")}${thSort("sessoes","Sessions",S.pgSort,"sortPg")}${thSort("cadastros","Cadastros",S.pgSort,"sortPg")}${thSort("conv","Conversão de página",S.pgSort,"sortPg")}</tr></thead>

}
